# Copy this example to a user-controlled configuration location and replace
# placeholders only after confirming the workspace settings.
kit_format_version: "1.1.0"
workspace_name: "<workspace-name>"

agent:
  type: "generic"
  compatibility: "conceptual"

language:
  conversation: "pt-BR"
  artifacts: "pt-BR"

blueprints:
  primary: "technical/web-dev"
  secondary: []

autonomy: "N2"
confirmation_required:
  - write
  - edit
  - delete
  - execute
  - network

memory:
  enabled: true
  path: ".agents/memory"
  index_file: ".agents/memory/index.md"

paths:
  central_rules: "AGENTS.md"
  skills: ".agents/skills"
  subagents: ".agents/subagents"
  documentation: "docs"

bootstrap:
  create_source_layout: true
  create_initial_domain: true
  create_initial_test: true
  initialize_git: false
  create_commit: false
